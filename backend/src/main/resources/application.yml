server:
  # Detrás de Caddy: Tomcat toma la IP del cliente y el esquema (https) de las cabeceras
  # X-Forwarded-*, pero solo si la petición llega desde una IP interna (nuestro proxy)
  forward-headers-strategy: native
  # Al parar, terminar las peticiones en curso antes de apagar (p. ej. al desplegar)
  shutdown: graceful

spring:
  application:
    name: backend

  config:
    # Lee el .env de la raíz del monorepo como si fuera un .properties. Las rutas son
    # relativas a la carpeta desde la que se arranca: "../.env" si es backend/ (mvnw),
    # ".env" si es la raíz (IntelliJ a veces arranca desde ahí). "optional:" evita fallar
    # si no existe (p. ej. en producción, donde las variables vienen del entorno).
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]

  datasource:
    # En Docker (producción) el host es el nombre del servicio: POSTGRES_HOST=postgres
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:supermercado}${POSTGRES_PARAMS:}
    username: ${POSTGRES_USER:supermercado}
    password: ${POSTGRES_PASSWORD}

  security:
    oauth2:
      client:
        registration:
          # Google es un proveedor conocido por Spring: ya sabe sus URLs de autorización,
          # token y claves. Solo hay que darle nuestras credenciales y los permisos (scope).
          # El valor por defecto deja arrancar la app aunque aún no hayas creado las credenciales.
          google:
            client-id: ${GOOGLE_CLIENT_ID:sin-configurar}
            client-secret: ${GOOGLE_CLIENT_SECRET:sin-configurar}
            scope: openid, email, profile
            # URL a la que Google devuelve al usuario. Debe coincidir EXACTAMENTE con la registrada
            # en Google Cloud. Por defecto Spring la deduce de la cabecera Host, pero el proxy de
            # Vite la cambia a localhost:8080; así siempre sale del dominio público del frontend.
            redirect-uri: ${app.auth.frontend-url}/login/oauth2/code/google

  jpa:
    # El esquema lo gestiona Flyway; Hibernate solo comprueba que las entidades encajan.
    hibernate:
      ddl-auto: validate
    # Sin sesión de BD abierta durante toda la petición HTTP: las consultas ocurren en los servicios.
    open-in-view: false

app:
  auth:
    jwt-secret: ${JWT_SECRET:}
    issuer: supermercado-app
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    # En producción siempre true. Los navegadores aceptan cookies Secure en http://localhost.
    cookie-secure: true
    # Único origen desde el que se aceptan /api/auth/refresh y /logout
    frontend-url: ${FRONTEND_URL:http://localhost:5173}

  rate-limit:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
