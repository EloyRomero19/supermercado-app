server:
  # Detrás de Caddy: Tomcat toma la IP del cliente y el esquema (https) de las cabeceras
  # X-Forwarded-*, pero solo si la petición llega desde una IP interna (nuestro proxy)
  forward-headers-strategy: native
  # Al parar, terminar las peticiones en curso antes de apagar (p. ej. al desplegar)
  shutdown: graceful

spring:
  application:
    name: backend

  config:
    # Lee el .env de la raíz del monorepo como si fuera un .properties. Las rutas son
    # relativas a la carpeta desde la que se arranca: "../.env" si es backend/ (mvnw),
    # ".env" si es la raíz (IntelliJ a veces arranca desde ahí). "optional:" evita fallar
    # si no existe (p. ej. en producción, donde las variables vienen del entorno).
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]

  datasource:
    # En Docker (producción) el host es el nombre del servicio: POSTGRES_HOST=postgres
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:supermercado}${POSTGRES_PARAMS:}
    username: ${POSTGRES_USER:supermercado}
    password: ${POSTGRES_PASSWORD}

  # Correo saliente por SMTP (para "¿Has olvidado tu contraseña?"). Variables MAIL_* en .env.example.
  # Sin MAIL_HOST no se envía nada: el enlace sale en el log (útil en desarrollo).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      # Puerto 587: la conexión empieza en claro y pasa a cifrada (STARTTLS); exigido, no opcional
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:true}
      # Que un SMTP lento no deje el hilo colgado para siempre (milisegundos)
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  jpa:
    # El esquema lo gestiona Flyway; Hibernate solo comprueba que las entidades encajan.
    hibernate:
      ddl-auto: validate
    # Sin sesión de BD abierta durante toda la petición HTTP: las consultas ocurren en los servicios.
    open-in-view: false

app:
  auth:
    jwt-secret: ${JWT_SECRET:}
    issuer: supermercado-app
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    # El texto del email dice "caduca en 1 hora": cambiarlo también allí (PasswordResetMailer)
    password-reset-ttl: 1h
    # En producción siempre true. Los navegadores aceptan cookies Secure en http://localhost.
    cookie-secure: true
    # Único origen desde el que se aceptan /api/auth/refresh y /logout
    frontend-url: ${FRONTEND_URL:http://localhost:5173}

  mail:
    # Remitente de los correos. Vacío = MAIL_USERNAME (con Gmail tiene que ser esa misma cuenta)
    from: ${MAIL_FROM:}

  rate-limit:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # Si el SMTP fallara o no estuviera configurado, /actuator/health daría 503 y Docker
    # reiniciaría el backend. Sin correo la app funciona igual: no cuenta para la salud.
    mail:
      enabled: false
