  </filter>
  <rect width="512" height="512" rx="112" fill="#26302c"/>
  <g filter="url(#t)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 222 H412 L374 404 H138Z" stroke="#f1efe7" stroke-width="30"/>
    <path d="M178 222 L238 110 M334 222 L274 110" stroke="#f1efe7" stroke-width="30"/>
    <path d="M198 268 L208 360 M256 268 V360 M314 268 L304 360" stroke="#f1efe7" stroke-width="22" opacity=".7"/>
