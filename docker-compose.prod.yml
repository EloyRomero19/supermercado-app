# Producción: Postgres + backend + Caddy (web y HTTPS). En el servidor:
#   docker compose -f docker-compose.prod.yml up -d --build
# Lee las variables del .env (ver .env.example, sección "Producción").
name: supermercado-prod

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supermercado}
      POSTGRES_USER: ${POSTGRES_USER:-supermercado}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql
    # Sin "ports": la base de datos solo es accesible desde la red interna de Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-supermercado}
      POSTGRES_USER: ${POSTGRES_USER:-supermercado}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      # ":-" usa el valor por defecto también si la variable está vacía
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-sin-configurar}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-sin-configurar}
      FRONTEND_URL: ${PUBLIC_URL:?Define PUBLIC_URL en .env (p. ej. https://tudominio.com)}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  # Copias de seguridad automáticas (backup/backup.sh). Misma imagen que la base de datos: ya trae
  # pg_dump en la versión exacta. Las copias quedan en la carpeta backups/ del servidor.
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supermercado}
      POSTGRES_USER: ${POSTGRES_USER:-supermercado}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
    # Tras el backend: así la primera copia ya tiene las tablas creadas por Flyway
    depends_on:
      backend:
        condition: service_healthy
    # "unhealthy" en docker compose ps si la última copia tiene más de 26 h (algo va mal)
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name 'quefalta-*.dump' -mmin -1560 | grep -q ."]
      interval: 10m
      timeout: 10s
      start_period: 2m
      start_interval: 10s # mientras arranca, comprueba a menudo (si no, tardaría 10 min en estar "healthy")

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en .env (p. ej. tudominio.com)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    volumes:
      - caddy_data:/data # certificados HTTPS: no borrar este volumen
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
